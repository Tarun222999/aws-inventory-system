name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject High and Critical npm advisories
        run: npm audit --audit-level=high

      - name: Check types, lint and formatting
        run: npm run check

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run backend and frontend unit tests
        run: npm run test:unit

  integration:
    name: Database integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: order_platform_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d order_platform_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data

    env:
      DATABASE_URL: postgresql://ci_user:ci-local-only@127.0.0.1:55432/order_platform_ci
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply committed migrations
        run: npm run db:migrate

      - name: Run database integration tests
        run: npm run test:integration

  build:
    name: Production builds
    needs: [checks, unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan source dependencies and possible secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          cache: false
          skip-dirs: "**/node_modules,**/dist,.git,.artifacts,.cache"

      - name: Build production applications
        run: npm run build

      - name: Build backend container
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile.backend \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag order-platform-backend:ci \
            .

      - name: Scan built backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          scan-type: image
          image-ref: order-platform-backend:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          cache: false

      - name: Export verified backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/backend-release"
          mkdir -p "$release_dir"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          docker image inspect order-platform-backend:ci |
            jq \
              --arg commit "$GITHUB_SHA" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg attempt "$GITHUB_RUN_ATTEMPT" \
              '.[0] | {
                schemaVersion: 1,
                commit: $commit,
                runId: $run_id,
                runAttempt: $attempt,
                imageId: .Id,
                platform: (.Os + "/" + .Architecture),
                revisionLabel: .Config.Labels["org.opencontainers.image.revision"],
                uncompressedBytes: .Size,
                localTag: "order-platform-backend:ci"
              }' > "$release_dir/image-metadata.json"

          jq -e --arg commit "$GITHUB_SHA" \
            '.commit == $commit and
             .revisionLabel == $commit and
             .platform == "linux/amd64"' \
            "$release_dir/image-metadata.json" > /dev/null

          docker save order-platform-backend:ci |
            gzip -1 > "$release_dir/backend-image.tar.gz"

          cd "$release_dir"
          sha256sum backend-image.tar.gz image-metadata.json > SHA256SUMS

      - name: Upload verified backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
